[package]
name = "TextGO"
version = "1.0.0"
description = "A customizable text selection popup tool"
authors = ["Xylitol <jam.xylitol@gmail.com>"]
license = "GPL-3.0-or-later"
edition = "2021"

[profile.release]
strip = "symbols"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "textgo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-os = "2.4.0"
tauri-plugin-fs = "2.6.0"
tauri-plugin-store = "2.5.0"
tauri-plugin-dialog = "2.8.1"
tauri-plugin-opener = "2.7.0"
tauri-plugin-updater = "2.13.1"
tauri-plugin-process = "2.4.0"
tauri-plugin-autostart = "2.6.0"
tauri-plugin-deep-link = "2.6.1"
tauri-plugin-global-shortcut = "2.4.0"
tauri-plugin-single-instance = { version = "2.5.2", features = ["deep-link"] }
tauri-plugin-http = { version = "2.8.0", features = ["unsafe-headers"] }
tauri-plugin-log = { version = "2.10.0", features = ["colored"] }
log = "0.4.34"
fern = "0.7.1"
tokio = { version = "1.53.1", features = ["process", "rt-multi-thread"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
clipboard-rs = "0.3.5"
wildmatch = "2.6.1"
lingua = { version = "1.8.0", default-features = false, features = [
  "english",
  "chinese",
  "japanese",
  "korean",
  "russian",
  "french",
  "german",
  "spanish",
  "portuguese",
  "arabic",
] }
base64 = "0.22.1"
enigo = "0.6.1"
rdev = { git = "https://github.com/C5H12O5/rdev", rev = "e1145ce" }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", rev = "da9c9a8" }
plist = "1.10.1"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_System_Variant",
  "Win32_System_Threading",
  "Win32_UI_Accessibility",
  "Win32_UI_WindowsAndMessaging",
  "UI_ViewManagement",
] }
